name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The committed action bundle is up to date
        run: npm run bundle && git diff --exit-code action/shaken.mjs

  # Shaken inspecting its own quick-start agent, through the action, the way users run it.
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          working-directory: examples/quickstart
